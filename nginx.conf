server {
    listen 80 default_server;
    server_name fast.infopluto.com;

    # Global HTTP to HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name fast.infopluto.com;

    # SSL Certificates mapped via volume mount from your host system
    ssl_certificate /etc/letsencrypt/live/fast.infopluto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fast.infopluto.com/privkey.pem;

    # Performance optimizations for SSL/TLS streaming
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /data/nginx_access.log combined;
    error_log /data/nginx_error.log warn;

    # HLS Streaming - Final Optimized for External HTTPS (SSAI)
    location /channel/ {
        proxy_pass http://127.0.0.1:5000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;     # Force HTTPS
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Ssl on;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # TV Manager
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

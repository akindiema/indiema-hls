events {
    worker_connections 4096;     # Increased for better concurrency
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # === Best Log Format for Analytics Collector ===
    log_format hls_stream '$remote_addr - [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" '
                         '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log hls_stream;
    error_log  stderr warn;

    server {
        listen 80 default_server;
        server_name fast.infopluto.com;

        # Root - TV Manager
        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # HLS Streaming Engine
        location /channel/ {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Monitor Dashboard
        location /monitor {
            proxy_pass http://127.0.0.1:5020/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/analytics {
            proxy_pass http://127.0.0.1:5020/api/analytics;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /analytics-health {
            proxy_pass http://127.0.0.1:5021/health;
        }

        # Optional: Health check for main services
        location /health {
            return 200 "OK\n";
            access_log off;
        }
    }
}

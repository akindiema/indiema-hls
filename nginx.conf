events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 1. HTTP Server - Redirects everything to HTTPS cleanly
    server {
        listen 80 default_server;
        server_name fast.infopluto.com;

        return 301 https://$host$request_uri;
    }

    # 2. HTTPS Secure Server
    server {
        listen 443 ssl default_server;
        server_name fast.infopluto.com;

        # References the certificate files generated/copied by your Dockerfile
        ssl_certificate /data/fullchain.pem;
        ssl_certificate_key /data/privkey.pem;

        # High-performance streaming security protocols
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        access_log off;
        error_log /data/nginx_error.log warn;

        # HLS Video Streams Proxy
        location /channel/ {
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-Ssl on;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # TV Manager Panel Routing
        location / {
            proxy_pass http://127.0.0.1:5001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
